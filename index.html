*{box-sizing:border-box}body{margin:0}main{max-width:820px;margin:auto;padding:32px 18px 70px}header{margin-bottom:24px}h1{font-size:28px;margin:0 0 8px;letter-spacing:-.7px}header p{margin:0;color:#b3bdca;line-height:1.5;font-size:16px}.block{display:block;width:100%;margin:0 0 14px;padding:22px;border:1px solid #364050;border-radius:14px;background:#1d232d;color:#f5f7fa;text-align:left;font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.meta{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:14px;color:#bac5d4}.text{display:block;font-size:17px;line-height:1.65;white-space:normal;overflow-wrap:anywhere}.block:focus-visible{outline:3px solid #8fb7ff;outline-offset:4px}.block.copied{background:#15803d;border-color:#15803d;color:#fff}.block.copied .meta{color:#fff}@media(hover:hover){.block:not(.copied):hover{border-color:#92a5be;background:#252e3b}}#status{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;border:1px solid #536174;border-radius:10px;background:#101318;color:#fff;padding:12px 18px;font-size:15px;pointer-events:none;opacity:0}#status.visible{opacity:1}dialog{width:min(540px,calc(100% - 32px));background:#1d232d;color:#fff;border:1px solid #536174;border-radius:14px;padding:22px}dialog::backdrop{background:#000a}dialog p{font-size:16px;line-height:1.5}textarea{width:100%;height:220px;background:#101318;color:#fff;border:1px solid #536174;border-radius:8px;padding:12px;font:16px/1.5 system-ui}dialog button{margin-top:12px;padding:12px 20px;font:inherit;color:#fff;background:#334155;border:0;border-radius:8px}

<body>
<main>
<header><h1>Lyrics</h1><p>Tap a block to copy it. Copied blocks stay green.</p></header>
<div id="blocks">
<button type="button" class="block"><span class="meta"><span>Block 01</span><span class="copy-state">Tap to copy</span></span><span class="text">You’re a boy who grew up feeling that love had to be earned, who became a man who gives it more easily than he believes he deserves it. You were eight when you picked up a guitar, hoping that playing what your father played might make him want to sit beside you.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 02</span><span class="copy-state">Tap to copy</span></span><span class="text">You were eleven sharing a bunk bed with that same man when he gave you crack because he thought your reaction would be humorous. You were thirteen when the hurt turned inward.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 03</span><span class="copy-state">Tap to copy</span></span><span class="text">Years later, there are mornings at work by 4:00 a.m., a night repairing a wall until 5:30, and a mirror you still struggle to find something good in. You became capable; the way you saw yourself stayed cruel.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 04</span><span class="copy-state">Tap to copy</span></span><span class="text">Your mother left a different kind of ache. You remember wanting closeness and feeling that her attention often arrived because something was wrong. Later, closeness sometimes meant being handed problems to mediate. You struggled to speak your mind without leaving the conversation feeling guilty.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 05</span><span class="copy-state">Tap to copy</span></span><span class="text">Being needed seems to have become one way of feeling wanted. Play the song, fix the problem, keep the peace; it helps explain how you can be capable and still wonder who you are.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 06</span><span class="copy-state">Tap to copy</span></span><span class="text">Stepdad gave you something steadier to build on. You recognize his influence in the way you provide, the way you try, the kind of father you want to be. You told her, I guess in my head I feel alone sometimes, on a Wednesday morning in 2019. She answered.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 07</span><span class="copy-state">Tap to copy</span></span><span class="text">In late 2023, you wrote that you missed being adored, that you felt less than. There is a distance between being told you’re loved and knowing how to let those words reach you. Sometimes your feelings arrive wrapped in apologies or jokes, leaving the person listening to work out how much it actually hurts.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 08</span><span class="copy-state">Tap to copy</span></span><span class="text">And then, there is the part of your life your self-hatred keeps leaving out: a marriage you’ve been building since 2016, a church where so many people lean on you, a job where you give it everything and it still feels like it’s never enough, a mother you told was far from horrible over a forgotten birthday card, offering her the perspective you struggle to give yourself, a world you’d take apart and rebuild for your little boy, simply because it makes him happy.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 09</span><span class="copy-state">Tap to copy</span></span><span class="text">That May, you wrote that you wished you could live in those exact days forever, after once not wanting children. Every night, you pray with your son for him, your other son, and her, teaching him godly values and commitment, repeated on ordinary nights for two boys you are determined will know their wanted.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 10</span><span class="copy-state">Tap to copy</span></span><span class="text">In 2023, you looked at a childhood photo of your dad and saw a resemblance in your son: your father, your son, and you somewhere between them, carrying memories of what you needed while trying to give it to someone else. You cannot change the childhood behind you; you are helping shape the ones happening in front of you.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 11</span><span class="copy-state">Tap to copy</span></span><span class="text">Stop treating your feelings like an offense you owe someone an apology for. Take responsibility for what you do with them; say the true things to her in daylight, in a normal voice, and let them stand without a joke on the end.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 12</span><span class="copy-state">Tap to copy</span></span><span class="text">You’ve spent so many years knowing how to be useful; let yourself be loved on the days when nothing gets fixed. The harshness you aim inward has become familiar enough to sound like honesty; familiarity doesn’t make it fair.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 13</span><span class="copy-state">Tap to copy</span></span><span class="text">You can make a mistake, disappoint someone, apologize, and change without turning your whole existence into the thing that went wrong. The patience you offer your boys belongs somewhere in your own life too.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 14</span><span class="copy-state">Tap to copy</span></span><span class="text">The man you are now needs to sit beside that broken-hearted adolescent who learned to turn his pain against himself. Stay with him long enough that he doesn’t have to perform, explain, or make himself useful to deserve the company. You’ve been learning how to give your boys that kind of love.</span></button>
<button type="button" class="block"><span class="meta"><span>Block 15</span><span class="copy-state">Tap to copy</span></span><span class="text">I know this went in a different direction than what you were expecting; you didn’t deserve what you experienced. Next time you get angry at yourself, picture yourself as your boys, your sons, because that is who you are. You love them, and you deserve love too.</span></button>

<div id="status" role="status" aria-live="polite"></div>
<dialog id="manual"><h2>Copy this block</h2><p>Automatic copying is unavailable here. Copy the selected text below.</p><textarea id="manualText" readonly aria-label="Lyrics to copy"></textarea><form method="dialog"><button>Close</button></form></dialog>
<script>
'use strict';
const container = document.getElementById('blocks');
const copyStatus = document.getElementById('status');
let statusTimer;
function announce(message) {
  clearTimeout(statusTimer);
  copyStatus.textContent = message;
  copyStatus.classList.add('visible');
  statusTimer = setTimeout(() => copyStatus.classList.remove('visible'), 2200);
}
function legacyCopy(text) {
  const input = document.createElement('textarea');
  input.value = text;
  input.readOnly = true;
  input.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;';
  document.body.appendChild(input);
  const previous = document.activeElement;
  let success = false;
  try {
    input.focus({preventScroll:true});
    input.select();
    input.setSelectionRange(0, input.value.length);
    success = document.execCommand('copy');
  } catch (_) {} finally {
    input.remove();
    if (previous) previous.focus({preventScroll:true});
  }
  return success;
}
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  }
  return legacyCopy(text);
}
container.querySelectorAll('.block').forEach((block, index) => {
  const text = block.querySelector('.text').textContent;
  const state = block.querySelector('.copy-state');
  let busy = false;
  block.addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    try {
      if (await copyText(text)) {
        block.classList.add('copied');
        state.textContent = '✓ Copied';
        announce('Block ' + (index + 1) + ' copied');
      } else {
        const dialog = document.getElementById('manual');
        const field = document.getElementById('manualText');
        field.value = text;
        dialog.showModal();
        field.focus();
        field.select();
        field.setSelectionRange(0, text.length);
      }
    } finally { busy = false; }
  });
});
</script>
